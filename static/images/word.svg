<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="450" fill="#1b52a1" />
  
  <!-- Subtle background decorative elements -->
  <!-- Top-left 'A' -->
  <text x="130" y="100" font-family="Arial, sans-serif" font-weight="bold" font-size="70" fill="#ffffff" fill-opacity="0.15">A</text>
  
  <!-- Top-right dots -->
  <circle cx="680" cy="80" r="5" fill="#ffffff" fill-opacity="0.2" />
  <circle cx="700" cy="80" r="5" fill="#ffffff" fill-opacity="0.2" />
  <circle cx="720" cy="80" r="5" fill="#ffffff" fill-opacity="0.2" />

  <!-- Right image icon placeholder -->
  <g transform="translate(580, 120)">
    <rect width="140" height="100" rx="8" fill="#154282" fill-opacity="0.4" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    <!-- Mountain/Sun graphic inside image icon -->
    <circle cx="110" cy="50" r="12" fill="#ffffff" fill-opacity="0.2"/>
    <path d="M 20 80 L 50 45 L 80 80 L 120 90 L 20 90 Z" fill="#ffffff" fill-opacity="0.2"/>
  </g>

  <!-- Left list icon placeholder -->
  <g transform="translate(80, 160)">
    <circle cx="15" cy="15" r="5" fill="#ffffff" fill-opacity="0.3"/>
    <rect x="35" y="12" width="60" height="6" rx="3" fill="#ffffff" fill-opacity="0.3"/>
    
    <circle cx="15" cy="45" r="5" fill="#ffffff" fill-opacity="0.3"/>
    <rect x="35" y="42" width="40" height="6" rx="3" fill="#ffffff" fill-opacity="0.3"/>
    
    <circle cx="15" cy="75" r="5" fill="#ffffff" fill-opacity="0.3"/>
    <rect x="35" y="72" width="50" height="6" rx="3" fill="#ffffff" fill-opacity="0.3"/>
  </g>

  <!-- Bottom-right 'A' -->
  <text x="660" y="360" font-family="Arial, sans-serif" font-weight="bold" font-size="90" fill="#ffffff" fill-opacity="0.15">A</text>

  <!-- Main Document Page -->
  <g transform="translate(260, 75)">
    <!-- Document Drop Shadow -->
    <rect x="4" y="4" width="280" height="320" rx="4" fill="#000000" fill-opacity="0.25"/>
    <!-- Document Base -->
    <rect width="280" height="320" rx="4" fill="#f8f9fa"/>
    
    <!-- Document Header lines -->
    <rect x="35" y="40" width="130" height="12" rx="3" fill="#d0d5dd"/>
    <rect x="35" y="66" width="90" height="8" rx="2" fill="#e4e7ec"/>
    
    <!-- Text Lines -->
    <rect x="35" y="110" width="150" height="10" rx="3" fill="#d0d5dd"/>
    <rect x="35" y="134" width="210" height="8" rx="2" fill="#e4e7ec"/>
    <rect x="35" y="152" width="180" height="8" rx="2" fill="#e4e7ec"/>
    
    <rect x="35" y="196" width="120" height="10" rx="3" fill="#d0d5dd"/>
    <rect x="35" y="220" width="190" height="8" rx="2" fill="#e4e7ec"/>
    
    <rect x="35" y="264" width="160" height="8" rx="2" fill="#d0d5dd"/>
  </g>

  <!-- Word Badge / Icon Overlay -->
  <g transform="translate(190, 130)">
    <!-- Badge Drop Shadow -->
    <rect x="4" y="4" width="130" height="130" rx="12" fill="#000000" fill-opacity="0.3"/>
    <!-- Badge Background -->
    <rect width="130" height="130" rx="12" fill="#2b579a"/>
    
    <!-- Letter W -->
    <text x="65" y="96" 
          font-family="Arial, sans-serif" 
          font-weight="900" 
          font-size="80" 
          fill="#ffffff" 
          text-anchor="middle">W</text>
  </g>
</svg>
