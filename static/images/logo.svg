<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Outer App Icon Background -->
  <rect width="512" height="512" rx="112" fill="#3D5A80" />

  <!-- Back Card Layer -->
  <rect x="200" y="72" width="268" height="350" rx="32" fill="#296B8E" />

  <!-- Main White Card -->
  <rect x="88" y="72" width="300" height="360" rx="32" fill="#FFFFFF" filter="url(#shadow)" />

  <!-- Checklist Item 1 -->
  <rect x="124" y="120" width="48" height="48" rx="12" fill="#4A4575" />
  <path d="M140 144 l8 8 l16 -18" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="192" y="132" width="140" height="24" rx="12" fill="#4A4575" />

  <!-- Checklist Item 2 -->
  <rect x="124" y="200" width="48" height="48" rx="12" fill="#4A4575" />
  <path d="M140 224 l8 8 l16 -18" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="192" y="212" width="140" height="24" rx="12" fill="#4A4575" />

  <!-- Checklist Item 3 (Unchecked) -->
  <rect x="124" y="280" width="48" height="48" rx="12" fill="none" stroke="#94B0C2" stroke-width="4" />
  <rect x="192" y="292" width="100" height="24" rx="12" fill="#94B0C2" />

  <!-- Stopwatch / Clock Element -->
  <g transform="translate(300, 280)">
    <rect x="52" y="-12" width="24" height="16" rx="4" fill="#FFFFFF" />
    <rect x="58" y="-20" width="12" height="10" fill="#FFFFFF" />
    
    <circle cx="64" cy="64" r="68" fill="#FFFFFF" filter="url(#shadow)" />
    <circle cx="64" cy="64" r="58" fill="#233554" />
    
    <path d="M64 64 L64 6 A58 58 0 0 1 122 64 Z" fill="#F0F4F8" opacity="0.9" />
    
    <line x1="64" y1="64" x2="48" y2="48" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <line x1="64" y1="64" x2="96" y2="64" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <circle cx="64" cy="64" r="5" fill="#FFFFFF" />
    
    <line x1="64" y1="10" x2="64" y2="16" stroke="#94B0C2" stroke-width="3" stroke-linecap="round" />
    <line x1="118" y1="64" x2="112" y2="64" stroke="#94B0C2" stroke-width="3" stroke-linecap="round" />
    <line x1="64" y1="118" x2="64" y2="112" stroke="#94B0C2" stroke-width="3" stroke-linecap="round" />
    <line x1="10" y1="64" x2="16" y2="64" stroke="#94B0C2" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
